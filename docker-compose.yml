services:
  redis:
    image: redis:7-alpine
    container_name: tccp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: tccp-api
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      FILE_UPLOAD_PATH: /app/public/upload
      BADGE_UPLOAD_PATH: /app/public/upload/badge
      AVATAR_UPLOAD_PATH: /app/public/upload/avatar
    volumes:
      - ./public/upload:/app/public/upload
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3003/').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  redis-data:
